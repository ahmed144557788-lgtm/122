<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mera Pehla GitHub Project</title>
    <style>
        /* CSS Styling Yahan Hai */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(10px);
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 15px;
        }
        p {
            font-size: 1.2rem;
            margin-bottom: 20px;
        }
        .btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: #fff;
            color: #764ba2;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn:hover {
            background-color: #ffdd57;
            color: #333;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Assalam o Alaikum! 👋</h1>
        <p>Yeh mera pehla GitHub project hai. Main developer ban raha hoon!</p>
        <!-- Yeh button mere GitHub profile par le jayega (Apna username dalna) -->
        <a href="https://github.com/" target="_blank" class="btn">Mera GitHub Profile</a>
    </div>

</body>
</html>
